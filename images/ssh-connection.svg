<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="Helvetica, Arial, sans-serif">
  <title>How an SSH connection is set up</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="760" height="450" fill="#ffffff"/>

  <!-- encrypted area -->
  <rect x="150" y="290" width="460" height="140" rx="8" fill="#ecfdf5" stroke="#86efac"/>
  <text x="600" y="306" text-anchor="end" font-size="12" fill="#15803d" font-weight="bold">encrypted from here on</text>

  <!-- participants -->
  <rect x="40" y="20" width="200" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="47" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Your laptop</text>
  <text x="140" y="69" text-anchor="middle" font-size="13" fill="#334155">ssh client</text>

  <rect x="520" y="20" width="200" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="620" y="47" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">ares.cyfronet.pl</text>
  <text x="620" y="69" text-anchor="middle" font-size="13" fill="#334155">sshd (SSH server)</text>

  <!-- lifelines -->
  <line x1="140" y1="84" x2="140" y2="435" stroke="#94a3b8" stroke-dasharray="5 5"/>
  <line x1="620" y1="84" x2="620" y2="435" stroke="#94a3b8" stroke-dasharray="5 5"/>

  <!-- 1 connect -->
  <text x="380" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">1. Connect to port 22</text>
  <line x1="145" y1="132" x2="612" y2="132" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="380" y="150" text-anchor="middle" font-size="12" fill="#475569">ssh plguser@ares.cyfronet.pl</text>

  <!-- 2 host key -->
  <text x="380" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">2. Server sends its host key</text>
  <line x1="615" y1="192" x2="148" y2="192" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="380" y="210" text-anchor="middle" font-size="12" fill="#475569">client checks it against ~/.ssh/known_hosts</text>

  <!-- 3 key exchange -->
  <text x="380" y="242" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">3. Key exchange</text>
  <line x1="148" y1="252" x2="612" y2="252" stroke="#334155" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="380" y="270" text-anchor="middle" font-size="12" fill="#475569">both sides agree on a secret session key</text>

  <!-- 4 user auth -->
  <text x="380" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">4. You prove who you are</text>
  <line x1="145" y1="342" x2="612" y2="342" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <text x="380" y="360" text-anchor="middle" font-size="12" fill="#475569">SSH key (or password), plus a TOTP code if the site uses MFA</text>

  <!-- 5 session -->
  <text x="380" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">5. Session</text>
  <line x1="148" y1="402" x2="612" y2="402" stroke="#334155" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="380" y="420" text-anchor="middle" font-size="12" fill="#475569">shell, scp, rsync, port forwarding</text>
</svg>
