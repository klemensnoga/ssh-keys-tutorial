<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Helvetica, Arial, sans-serif">
  <title>SSH key pair: private key on the laptop, public key on the server</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#ffffff"/>

  <!-- panels -->
  <rect x="20" y="20" width="260" height="400" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="150" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Your laptop</text>

  <rect x="480" y="20" width="260" height="400" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="610" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">ares.cyfronet.pl</text>

  <!-- private key -->
  <rect x="40" y="70" width="220" height="80" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="150" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">PRIVATE key</text>
  <text x="150" y="114" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#0f172a">~/.ssh/id_ed25519_ares</text>
  <text x="150" y="136" text-anchor="middle" font-size="12" fill="#9a3412">never leaves, locked by passphrase</text>

  <!-- public key -->
  <rect x="40" y="170" width="220" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="150" y="194" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">PUBLIC key</text>
  <text x="150" y="214" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#0f172a">~/.ssh/id_ed25519_ares.pub</text>
  <text x="150" y="228" text-anchor="middle" font-size="11" fill="#166534">safe to share</text>

  <!-- authorized_keys -->
  <rect x="500" y="170" width="220" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="610" y="194" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#0f172a">~/.ssh/authorized_keys</text>
  <text x="610" y="214" text-anchor="middle" font-size="12" fill="#166534">copy of your PUBLIC key</text>
  <text x="610" y="228" text-anchor="middle" font-size="11" fill="#166534">(one line per allowed key)</text>

  <!-- copy once -->
  <text x="380" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">copy once</text>
  <line x1="262" y1="202" x2="496" y2="202" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="380" y="220" text-anchor="middle" font-size="12" fill="#475569">ssh-copy-id or portal</text>

  <!-- every login -->
  <line x1="40" y1="262" x2="720" y2="262" stroke="#cbd5e1"/>
  <rect x="300" y="250" width="160" height="24" fill="#ffffff"/>
  <text x="380" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">At every login</text>

  <text x="380" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">1. random challenge</text>
  <line x1="476" y1="308" x2="284" y2="308" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <text x="150" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">2. sign it with the</text>
  <text x="150" y="362" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">PRIVATE key</text>

  <text x="380" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">3. signature</text>
  <line x1="284" y1="380" x2="476" y2="380" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <text x="610" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">4. check it with the</text>
  <text x="610" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">PUBLIC key: access</text>
</svg>
